# db-toolkit engine descriptor: FerretDB
#
# The OSI-licensed document database. FerretDB speaks the MongoDB wire
# protocol, so existing drivers and tools connect unchanged, but it is
# Apache 2.0 and stores data in PostgreSQL through Microsoft's open source
# DocumentDB extension.
#
# It exists here because MongoDB Community is SSPL, which the OSI declines to
# recognise as open source (SPEC section 22.5). FerretDB gives a document
# option with no licensing caveat at all.
#
# HONEST LIMITATIONS, so nobody discovers them in production: as of early 2026
# the gaps against MongoDB include $lookup and $facet aggregation stages, full
# transaction support, change streams, GridFS, and $text search indexes. It is
# a drop-in for the majority of workloads, not all of them. Applications that
# need those features should use the mongodb engine.

DBTK_ENGINE_NAME=ferretdb
DBTK_ENGINE_TITLE="FerretDB"
# Same family as MongoDB on purpose: it speaks the same wire protocol, so the
# mongodb family hooks (mongosh, mongodump, mongorestore) work against it
# unchanged. This is the abstraction paying for itself.
DBTK_ENGINE_FAMILY=mongodb
DBTK_ENGINE_PARADIGM=document

DBTK_ENGINE_VERSIONS="2"
DBTK_ENGINE_DEFAULT_VERSION=2

DBTK_ENGINE_PORT=27017
DBTK_ENGINE_HOST_PORT_DEFAULT=27018
# FerretDB is stateless: the data lives in its PostgreSQL backing store, which
# is a separate container. This is the directory in that backing store.
DBTK_ENGINE_DATA_DIR=/var/lib/postgresql/data
DBTK_ENGINE_SOCKET_DIR=''
DBTK_ENGINE_USER=ferretdb
DBTK_ENGINE_ROOT_SECRET=ferretdb_root_password.txt
# A proxy plus its backing store. The descriptor names the backing image so
# compose generation can wire the pair without special-casing FerretDB.
DBTK_ENGINE_BACKING_IMAGE='ghcr.io/ferretdb/postgres-documentdb:17'

DBTK_ENGINE_PING='mongosh --quiet --eval "db.adminCommand({ping:1}).ok"'
DBTK_ENGINE_CLIENT=mongosh
DBTK_ENGINE_SHELL='mongosh'

DBTK_ENGINE_DUMP='mongodump --archive --gzip'
DBTK_ENGINE_DUMP_GLOBALS=''
DBTK_ENGINE_RESTORE='mongorestore --archive --gzip --drop'
DBTK_ENGINE_BACKUP_EXT=archive

DBTK_ENGINE_AUTH_METHOD=SCRAM-SHA-256
DBTK_ENGINE_AUTH_OFF_BY_DEFAULT_UPSTREAM=false
DBTK_ENGINE_TLS_ALWAYS=false

# Same as MongoDB: the drivers pool, and they are the same drivers.
DBTK_ENGINE_POOLING=driver
DBTK_ENGINE_POOLER_IMAGE=''
DBTK_ENGINE_POOLING_REQUIRED_IN_PROD=false
DBTK_ENGINE_POOLING_RATIONALE='MongoDB-protocol drivers implement CMAP pooling'

DBTK_ENGINE_LICENSE=Apache-2.0
DBTK_ENGINE_OSI_APPROVED=true
DBTK_ENGINE_PUBLISH=derive

# The upstream entrypoint's own variables, so compose generation wires the
# image's contract without knowing which engine it is dealing with.
DBTK_ENGINE_ROOT_PW_ENV=FERRETDB_POSTGRESQL_URL_FILE
DBTK_ENGINE_DEFAULT_DB_ENV=

# Where a mounted conf.d override lands for this engine.
DBTK_ENGINE_OVERRIDES_DIR=/dbtk/overrides
