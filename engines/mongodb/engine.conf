# multidb-server engine descriptor: MongoDB
#
# LICENSING, read this before publishing an image built from it.
# MongoDB Community is SSPL, which the Open Source Initiative has explicitly
# declined to recognise as an open source licence. Redistribution IS permitted,
# so a derived image is allowed, but it is source-available rather than open
# source and the image label and docs must say so. The SSPL service clause
# binds anyone offering MongoDB *as a service*; running it as a development
# dependency does not trigger it.

MDB_ENGINE_NAME=mongodb
MDB_ENGINE_TITLE="MongoDB"
MDB_ENGINE_FAMILY=mongodb
MDB_ENGINE_PARADIGM=document

MDB_ENGINE_VERSIONS="7.0 8.0 8.3"
# Defaults to 7.0, NOT the newest, and that is deliberate.
#
# MongoDB 8.x refuses to start on Linux kernel 6.19 or newer:
#   "MongoDB cannot start: Linux kernel versions 6.19 and newer has a known
#    incompatibility with this version of MongoDB"
#   https://jira.mongodb.org/browse/SERVER-121912
#
# Verified here on kernel 7.0.14: 8.3.7 crash-loops, 7.0.39 runs. That kernel
# is not exotic -- OrbStack and current distributions ship it -- so defaulting
# to 8.x would hand a crash loop to a large share of users on first boot.
#
# 8.0 and 8.3 stay on the menu for anyone on an older kernel who wants them.
# Revisit when MongoDB ships the fix.
MDB_ENGINE_DEFAULT_VERSION=7.0

MDB_ENGINE_PORT=27017
MDB_ENGINE_HOST_PORT_DEFAULT=27017
# Offset from MDB_PORT_BASE when publishing. Explicit rather than derived from
# the engine's own port: 27017 + a 54000 base is 81017, past the end of the
# port range. Explicit offsets are always valid and do not shift when another
# engine is added. Check 31 asserts they are unique.
MDB_ENGINE_PORT_OFFSET=3
MDB_ENGINE_DATA_DIR=/data/db
MDB_ENGINE_SOCKET_DIR=/tmp
MDB_ENGINE_USER=mongodb
MDB_ENGINE_ROOT_SECRET=mongodb_root_password.txt

MDB_ENGINE_PING='mongosh --quiet --eval "db.adminCommand({ping:1}).ok"'
MDB_ENGINE_CLIENT=mongosh
MDB_ENGINE_SHELL='mongosh'

# mongodump/mongorestore are NOT in the official image: they moved to the
# separate mongodb-database-tools package, which our Dockerfile installs.
# --gzip because the archive format is otherwise uncompressed.
MDB_ENGINE_DUMP='mongodump --archive'
MDB_ENGINE_DUMP_GLOBALS=''
MDB_ENGINE_RESTORE='mongorestore --archive --drop'
MDB_ENGINE_BACKUP_EXT=archive

# The image runs with NO AUTHENTICATION unless root credentials are supplied:
# any client reaching the port is an administrator. Our image always supplies
# them (SPEC section 22.3).
MDB_ENGINE_AUTH_METHOD=SCRAM-SHA-256
MDB_ENGINE_AUTH_OFF_BY_DEFAULT_UPSTREAM=true
MDB_ENGINE_TLS_ALWAYS=false

# Drivers pool natively per the CMAP specification. An external pooler in front
# of MongoDB breaks topology discovery, server selection and retryable writes,
# so the correct guidance is "reuse one MongoClient per process" -- a docs
# problem, not an infrastructure one.
MDB_ENGINE_POOLING=driver
MDB_ENGINE_POOLER_IMAGE=''
MDB_ENGINE_POOLING_REQUIRED_IN_PROD=false
MDB_ENGINE_POOLING_RATIONALE='drivers implement CMAP pooling; a proxy breaks topology discovery'

MDB_ENGINE_LICENSE=SSPL-1.0
MDB_ENGINE_OSI_APPROVED=false
MDB_ENGINE_LICENSE_NOTE='Source-available, not OSI open source. See docs/licensing.md.'

# Publish policy: REFERENCE, not derive.
#
# We do not publish a multidb-server-mongodb image. Publishing one would mean
# distributing SSPL-licensed binaries under an MIT project's namespace, and
# every artefact this repository publishes should be OSI-licensed so that
# downstream users never have to reason about our supply chain.
#
# MongoDB is still fully supported: the upstream image is used directly and the
# toolkit applies its configuration at runtime instead of at build time. The
# user pulls MongoDB from MongoDB, which is where the licence obligation
# belongs.
#
# For a document database with no such constraint, see the ferretdb engine:
# Apache 2.0, MongoDB wire-protocol compatible.
MDB_ENGINE_PUBLISH=reference

# The upstream entrypoint's own variables, so compose generation wires the
# image's contract without knowing which engine it is dealing with.
MDB_ENGINE_ROOT_PW_ENV=MONGO_INITDB_ROOT_PASSWORD_FILE
MDB_ENGINE_DEFAULT_DB_ENV=MONGO_INITDB_DATABASE

# Where a mounted conf.d override lands for this engine.
MDB_ENGINE_OVERRIDES_DIR=/mdb/overrides

# Framework connection driver token, for the block new-project prints.
# Requires the mongodb/laravel-mongodb package; not a core Laravel driver.
MDB_ENGINE_DRIVER=mongodb
