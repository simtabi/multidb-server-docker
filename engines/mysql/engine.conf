# db-toolkit engine descriptor: MySQL

DBTK_ENGINE_NAME=mysql
DBTK_ENGINE_TITLE="MySQL"
DBTK_ENGINE_FAMILY=mysql
DBTK_ENGINE_PARADIGM=relational

DBTK_ENGINE_VERSIONS="8.0 8.4 9.7"
DBTK_ENGINE_DEFAULT_VERSION=8.4

DBTK_ENGINE_PORT=3306
DBTK_ENGINE_HOST_PORT_DEFAULT=3306
DBTK_ENGINE_DATA_DIR=/var/lib/mysql
DBTK_ENGINE_SOCKET_DIR=/var/run/mysqld
DBTK_ENGINE_USER=mysql
DBTK_ENGINE_ROOT_SECRET=mysql_root_password.txt

DBTK_ENGINE_PING='mysqladmin ping --protocol=socket'
DBTK_ENGINE_CLIENT=mysql
DBTK_ENGINE_SHELL='mysql --protocol=socket -uroot'

# --routines and --events are the two the defaults silently omit.
DBTK_ENGINE_DUMP='mysqldump --single-transaction --routines --triggers --events --quick'
DBTK_ENGINE_DUMP_GLOBALS=''
DBTK_ENGINE_RESTORE='mysql'
DBTK_ENGINE_BACKUP_EXT=sql

DBTK_ENGINE_AUTH_METHOD=caching_sha2_password
DBTK_ENGINE_TLS_ALWAYS=false

DBTK_ENGINE_POOLING=external
DBTK_ENGINE_POOLER_IMAGE='proxysql/proxysql:3.0.10@sha256:47437a4522a9f86690cfd730e97649e15a4e33b01bca9c093717a39296e04024'
DBTK_ENGINE_POOLING_REQUIRED_IN_PROD=false
DBTK_ENGINE_POOLING_RATIONALE='thread per connection, far cheaper than a process'

DBTK_ENGINE_LICENSE=GPL-2.0
DBTK_ENGINE_OSI_APPROVED=true

# Publish policy. `derive` means we build and publish db-toolkit-<engine> from
# the upstream base. See SPEC section 22.5.
DBTK_ENGINE_PUBLISH=derive

# The upstream entrypoint's own variables, so compose generation wires the
# image's contract without knowing which engine it is dealing with.
DBTK_ENGINE_ROOT_PW_ENV=MYSQL_ROOT_PASSWORD_FILE
DBTK_ENGINE_DEFAULT_DB_ENV=MYSQL_DATABASE

# Where a mounted conf.d override lands for this engine.
DBTK_ENGINE_OVERRIDES_DIR=/etc/mysql/conf.d/overrides
