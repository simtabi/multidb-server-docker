# my-multidb-server engine descriptor: MySQL

MMDB_ENGINE_NAME=mysql
MMDB_ENGINE_TITLE="MySQL"
MMDB_ENGINE_FAMILY=mysql
MMDB_ENGINE_PARADIGM=relational

MMDB_ENGINE_VERSIONS="8.0 8.4 9.7"
MMDB_ENGINE_DEFAULT_VERSION=8.4

MMDB_ENGINE_PORT=3306
MMDB_ENGINE_HOST_PORT_DEFAULT=3306
MMDB_ENGINE_DATA_DIR=/var/lib/mysql
MMDB_ENGINE_SOCKET_DIR=/var/run/mysqld
MMDB_ENGINE_USER=mysql
MMDB_ENGINE_ROOT_SECRET=mysql_root_password.txt

MMDB_ENGINE_PING='mysqladmin ping --protocol=socket'
MMDB_ENGINE_CLIENT=mysql
MMDB_ENGINE_SHELL='mysql --protocol=socket -uroot'

# --routines and --events are the two the defaults silently omit.
MMDB_ENGINE_DUMP='mysqldump --single-transaction --routines --triggers --events --quick'
MMDB_ENGINE_DUMP_GLOBALS=''
MMDB_ENGINE_RESTORE='mysql'
MMDB_ENGINE_BACKUP_EXT=sql

MMDB_ENGINE_AUTH_METHOD=caching_sha2_password
MMDB_ENGINE_TLS_ALWAYS=false

MMDB_ENGINE_POOLING=external
MMDB_ENGINE_POOLER_IMAGE='proxysql/proxysql:3.0.10@sha256:47437a4522a9f86690cfd730e97649e15a4e33b01bca9c093717a39296e04024'
MMDB_ENGINE_POOLING_REQUIRED_IN_PROD=false
# ProxySQL's client port. The admin interface (6032) is deliberately NOT
# published: it can read and rewrite every credential ProxySQL holds.
MMDB_ENGINE_POOLER_PORT=6033
MMDB_ENGINE_POOLER_HOST_PORT_DEFAULT=6033
MMDB_ENGINE_POOLER_SECRET=mysql_root_password.txt
MMDB_ENGINE_POOLER_CMD=/usr/local/bin/mmdb-proxysql-bootstrap
MMDB_ENGINE_POOLER_BOOTSTRAP=proxysql/bootstrap.sh
# ProxySQL persists its configuration into an SQLite database here. tmpfs, so
# the mirrored password verifiers never reach disk.
MMDB_ENGINE_POOLER_STATE_DIR=/var/lib/proxysql
MMDB_ENGINE_POOLER_UID=0
MMDB_ENGINE_POOLING_RATIONALE='thread per connection, far cheaper than a process'

MMDB_ENGINE_LICENSE=GPL-2.0
MMDB_ENGINE_OSI_APPROVED=true

# Publish policy. `derive` means we build and publish my-multidb-server-<engine> from
# the upstream base. See SPEC section 22.5.
MMDB_ENGINE_PUBLISH=derive

# The upstream entrypoint's own variables, so compose generation wires the
# image's contract without knowing which engine it is dealing with.
MMDB_ENGINE_ROOT_PW_ENV=MYSQL_ROOT_PASSWORD_FILE
MMDB_ENGINE_DEFAULT_DB_ENV=MYSQL_DATABASE

# Where a mounted conf.d override lands for this engine.
MMDB_ENGINE_OVERRIDES_DIR=/etc/mysql/conf.d/overrides

# Framework connection driver token, for the block new-project prints.
# MariaDB uses the same driver token as MySQL.
MMDB_ENGINE_DRIVER=mysql

# PITR via the binary log, the MySQL family's equivalent of WAL archiving.
#
# The official image ships no mysqlbinlog, so images/mysql/Dockerfile extracts
# that one file from the matching mysql-community-client RPM -- installing the
# package outright conflicts with server-minimal over /usr/bin/mysql and
# friends. Without it the binary log would be an audit trail rather than a
# recovery path.
MMDB_ENGINE_PITR_CAPABLE=true
MMDB_ENGINE_PITR_REPLAY_TOOL=mysqlbinlog
MMDB_ENGINE_PITR_REPO_PATH=/var/lib/mmdb-binlog
# The flag that records the binlog coordinates in a dump. MySQL renamed
# --master-data to --source-data in 8.0.26; MariaDB kept the original name.
MMDB_ENGINE_DUMP_POSITION_FLAG=source-data
