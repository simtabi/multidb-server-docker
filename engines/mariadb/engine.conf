# db-toolkit engine descriptor: MariaDB

DBTK_ENGINE_NAME=mariadb
DBTK_ENGINE_TITLE="MariaDB"
DBTK_ENGINE_FAMILY=mysql
DBTK_ENGINE_PARADIGM=relational

DBTK_ENGINE_VERSIONS="10.11 11.4 11.8"
DBTK_ENGINE_DEFAULT_VERSION=11.4

DBTK_ENGINE_PORT=3306
DBTK_ENGINE_HOST_PORT_DEFAULT=3307
DBTK_ENGINE_DATA_DIR=/var/lib/mysql
DBTK_ENGINE_SOCKET_DIR=/var/run/mysqld
DBTK_ENGINE_USER=mysql
DBTK_ENGINE_ROOT_SECRET=mariadb_root_password.txt

DBTK_ENGINE_PING='mariadb-admin ping --protocol=socket'
DBTK_ENGINE_CLIENT=mariadb
DBTK_ENGINE_SHELL='mariadb --protocol=socket -uroot'

# --routines and --events are the two the defaults silently omit.
DBTK_ENGINE_DUMP='mariadb-dump --single-transaction --routines --triggers --events --quick'
DBTK_ENGINE_DUMP_GLOBALS=''
DBTK_ENGINE_RESTORE='mysql'
DBTK_ENGINE_BACKUP_EXT=sql

DBTK_ENGINE_AUTH_METHOD=ed25519
DBTK_ENGINE_TLS_ALWAYS=false

DBTK_ENGINE_POOLING=external
DBTK_ENGINE_POOLER_IMAGE='proxysql/proxysql:3.0.10@sha256:47437a4522a9f86690cfd730e97649e15a4e33b01bca9c093717a39296e04024'
DBTK_ENGINE_POOLING_REQUIRED_IN_PROD=false
# ProxySQL's client port. The admin interface (6032) is deliberately NOT
# published: it can read and rewrite every credential ProxySQL holds.
DBTK_ENGINE_POOLER_PORT=6033
DBTK_ENGINE_POOLER_HOST_PORT_DEFAULT=6034
DBTK_ENGINE_POOLER_SECRET=mariadb_root_password.txt
DBTK_ENGINE_POOLER_CMD=/usr/local/bin/dbtk-proxysql-bootstrap
DBTK_ENGINE_POOLER_BOOTSTRAP=proxysql/bootstrap.sh
# ProxySQL persists its configuration into an SQLite database here. tmpfs, so
# the mirrored password verifiers never reach disk.
DBTK_ENGINE_POOLER_STATE_DIR=/var/lib/proxysql
DBTK_ENGINE_POOLER_UID=0
DBTK_ENGINE_POOLING_RATIONALE='thread per connection, far cheaper than a process'

DBTK_ENGINE_LICENSE=GPL-2.0
DBTK_ENGINE_OSI_APPROVED=true

# Publish policy. `derive` means we build and publish db-toolkit-<engine> from
# the upstream base. See SPEC section 22.5.
DBTK_ENGINE_PUBLISH=derive

# The upstream entrypoint's own variables, so compose generation wires the
# image's contract without knowing which engine it is dealing with.
DBTK_ENGINE_ROOT_PW_ENV=MARIADB_ROOT_PASSWORD_FILE
DBTK_ENGINE_DEFAULT_DB_ENV=MARIADB_DATABASE

# Where a mounted conf.d override lands for this engine.
DBTK_ENGINE_OVERRIDES_DIR=/etc/mysql/conf.d/overrides

# Framework connection driver token, for the block new-project prints.
# MariaDB uses the same driver token as MySQL.
DBTK_ENGINE_DRIVER=mysql
