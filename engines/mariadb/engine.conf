# multidb-server engine descriptor: MariaDB

MDB_ENGINE_NAME=mariadb
MDB_ENGINE_TITLE="MariaDB"
MDB_ENGINE_FAMILY=mysql
MDB_ENGINE_PARADIGM=relational

MDB_ENGINE_VERSIONS="10.11 11.4 11.8"
MDB_ENGINE_DEFAULT_VERSION=11.4

MDB_ENGINE_PORT=3306
MDB_ENGINE_HOST_PORT_DEFAULT=3307
MDB_ENGINE_DATA_DIR=/var/lib/mysql
MDB_ENGINE_SOCKET_DIR=/var/run/mysqld
MDB_ENGINE_USER=mysql
MDB_ENGINE_ROOT_SECRET=mariadb_root_password.txt

MDB_ENGINE_PING='mariadb-admin ping --protocol=socket'
MDB_ENGINE_CLIENT=mariadb
MDB_ENGINE_SHELL='mariadb --protocol=socket -uroot'

# --routines and --events are the two the defaults silently omit.
MDB_ENGINE_DUMP='mariadb-dump --single-transaction --routines --triggers --events --quick'
MDB_ENGINE_DUMP_GLOBALS=''
MDB_ENGINE_RESTORE='mysql'
MDB_ENGINE_BACKUP_EXT=sql

MDB_ENGINE_AUTH_METHOD=ed25519
MDB_ENGINE_TLS_ALWAYS=false

MDB_ENGINE_POOLING=external
MDB_ENGINE_POOLER_IMAGE='proxysql/proxysql:3.0.10@sha256:47437a4522a9f86690cfd730e97649e15a4e33b01bca9c093717a39296e04024'
MDB_ENGINE_POOLING_REQUIRED_IN_PROD=false
# ProxySQL's client port. The admin interface (6032) is deliberately NOT
# published: it can read and rewrite every credential ProxySQL holds.
MDB_ENGINE_POOLER_PORT=6033
MDB_ENGINE_POOLER_HOST_PORT_DEFAULT=6034
MDB_ENGINE_POOLER_SECRET=mariadb_root_password.txt
MDB_ENGINE_POOLER_CMD=/usr/local/bin/mdb-proxysql-bootstrap
MDB_ENGINE_POOLER_BOOTSTRAP=proxysql/bootstrap.sh
# ProxySQL persists its configuration into an SQLite database here. tmpfs, so
# the mirrored password verifiers never reach disk.
MDB_ENGINE_POOLER_STATE_DIR=/var/lib/proxysql
MDB_ENGINE_POOLER_UID=0
MDB_ENGINE_POOLING_RATIONALE='thread per connection, far cheaper than a process'

MDB_ENGINE_LICENSE=GPL-2.0
MDB_ENGINE_OSI_APPROVED=true

# Publish policy. `derive` means we build and publish multidb-server-<engine> from
# the upstream base. See SPEC section 22.5.
MDB_ENGINE_PUBLISH=derive

# The upstream entrypoint's own variables, so compose generation wires the
# image's contract without knowing which engine it is dealing with.
MDB_ENGINE_ROOT_PW_ENV=MARIADB_ROOT_PASSWORD_FILE
MDB_ENGINE_DEFAULT_DB_ENV=MARIADB_DATABASE

# Where a mounted conf.d override lands for this engine.
MDB_ENGINE_OVERRIDES_DIR=/etc/mysql/conf.d/overrides

# Framework connection driver token, for the block new-project prints.
# MariaDB uses the same driver token as MySQL.
MDB_ENGINE_DRIVER=mysql

# PITR via the binary log, which is the MySQL family's equivalent of WAL
# archiving. The log lives on its OWN volume, never inside the data directory,
# so it survives the loss of the thing it recovers.
MDB_ENGINE_PITR_CAPABLE=true
MDB_ENGINE_PITR_REPO_PATH=/var/lib/mdb-binlog
# The tool that replays the log. Named here because it is what makes PITR
# usable: a binary log nothing can read back is an audit trail, not a backup.
MDB_ENGINE_PITR_REPLAY_TOOL=mariadb-binlog
# The flag that records the binlog coordinates in a dump. MySQL renamed
# --master-data to --source-data in 8.0.26; MariaDB kept the original name.
MDB_ENGINE_DUMP_POSITION_FLAG=master-data
