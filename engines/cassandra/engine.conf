# my-multidb-server engine descriptor: Apache Cassandra

MMDB_ENGINE_NAME=cassandra
MMDB_ENGINE_TITLE="Apache Cassandra"
MMDB_ENGINE_FAMILY=cassandra
MMDB_ENGINE_PARADIGM=wide-column

MMDB_ENGINE_VERSIONS="4.1 5.0"
MMDB_ENGINE_DEFAULT_VERSION=5.0

MMDB_ENGINE_PORT=9042
MMDB_ENGINE_HOST_PORT_DEFAULT=9042
MMDB_ENGINE_DATA_DIR=/var/lib/cassandra
MMDB_ENGINE_SOCKET_DIR=''
MMDB_ENGINE_USER=cassandra
MMDB_ENGINE_ROOT_SECRET=cassandra_root_password.txt

MMDB_ENGINE_PING='nodetool status'
MMDB_ENGINE_CLIENT=cqlsh
MMDB_ENGINE_SHELL='cqlsh'

# Cassandra has no logical dump tool comparable to pg_dump. A snapshot is a
# hard-linked, per-node, point-in-time copy of the SSTables; the toolkit tars
# it so the artefact is a single verifiable file like every other engine's.
MMDB_ENGINE_DUMP='nodetool snapshot'
MMDB_ENGINE_DUMP_GLOBALS=''
MMDB_ENGINE_RESTORE='sstableloader'
MMDB_ENGINE_BACKUP_EXT=tar
MMDB_ENGINE_BACKUP_STRATEGY=snapshot

# Ships AllowAllAuthenticator AND AllowAllAuthorizer: not weak authentication,
# none at all, and no authorization either. Our image flips both
# (SPEC section 22.3).
MMDB_ENGINE_AUTH_METHOD=PasswordAuthenticator
MMDB_ENGINE_AUTH_OFF_BY_DEFAULT_UPSTREAM=true
MMDB_ENGINE_TLS_ALWAYS=false

# The driver keeps connections per node under a load-balancing policy and
# multiplexes thousands of concurrent requests per connection. A proxy in front
# defeats token-aware routing, which is where most of the performance is.
MMDB_ENGINE_POOLING=driver
MMDB_ENGINE_POOLER_IMAGE=''
MMDB_ENGINE_POOLING_REQUIRED_IN_PROD=false
MMDB_ENGINE_POOLING_RATIONALE='driver multiplexes per node; a proxy defeats token-aware routing'

# Not a dev-profile default: the JVM heap alone dwarfs the SQL engines.
MMDB_ENGINE_MIN_MEMORY_MB=2048
MMDB_ENGINE_HEAVY=true

MMDB_ENGINE_LICENSE=Apache-2.0
MMDB_ENGINE_OSI_APPROVED=true

# Publish policy. `derive` means we build and publish my-multidb-server-<engine> from
# the upstream base. See SPEC section 22.5.
MMDB_ENGINE_PUBLISH=derive

# The upstream entrypoint's own variables, so compose generation wires the
# image's contract without knowing which engine it is dealing with.
MMDB_ENGINE_ROOT_PW_ENV=CASSANDRA_PASSWORD_FILE
MMDB_ENGINE_DEFAULT_DB_ENV=

# Where a mounted conf.d override lands for this engine.
MMDB_ENGINE_OVERRIDES_DIR=/mmdb/overrides

# Framework connection driver token, for the block new-project prints.
# No first-party Laravel driver; use a DataStax-compatible client.
MMDB_ENGINE_DRIVER=cassandra
