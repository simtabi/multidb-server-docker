# db-toolkit engine descriptor: Apache Cassandra

DBTK_ENGINE_NAME=cassandra
DBTK_ENGINE_TITLE="Apache Cassandra"
DBTK_ENGINE_FAMILY=cassandra
DBTK_ENGINE_PARADIGM=wide-column

DBTK_ENGINE_VERSIONS="4.1 5.0"
DBTK_ENGINE_DEFAULT_VERSION=5.0

DBTK_ENGINE_PORT=9042
DBTK_ENGINE_HOST_PORT_DEFAULT=9042
DBTK_ENGINE_DATA_DIR=/var/lib/cassandra
DBTK_ENGINE_SOCKET_DIR=''
DBTK_ENGINE_USER=cassandra
DBTK_ENGINE_ROOT_SECRET=cassandra_root_password.txt

DBTK_ENGINE_PING='nodetool status'
DBTK_ENGINE_CLIENT=cqlsh
DBTK_ENGINE_SHELL='cqlsh'

# Cassandra has no logical dump tool comparable to pg_dump. A snapshot is a
# hard-linked, per-node, point-in-time copy of the SSTables; the toolkit tars
# it so the artefact is a single verifiable file like every other engine's.
DBTK_ENGINE_DUMP='nodetool snapshot'
DBTK_ENGINE_DUMP_GLOBALS=''
DBTK_ENGINE_RESTORE='sstableloader'
DBTK_ENGINE_BACKUP_EXT=tar
DBTK_ENGINE_BACKUP_STRATEGY=snapshot

# Ships AllowAllAuthenticator AND AllowAllAuthorizer: not weak authentication,
# none at all, and no authorization either. Our image flips both
# (SPEC section 22.3).
DBTK_ENGINE_AUTH_METHOD=PasswordAuthenticator
DBTK_ENGINE_AUTH_OFF_BY_DEFAULT_UPSTREAM=true
DBTK_ENGINE_TLS_ALWAYS=false

# The driver keeps connections per node under a load-balancing policy and
# multiplexes thousands of concurrent requests per connection. A proxy in front
# defeats token-aware routing, which is where most of the performance is.
DBTK_ENGINE_POOLING=driver
DBTK_ENGINE_POOLER_IMAGE=''
DBTK_ENGINE_POOLING_REQUIRED_IN_PROD=false
DBTK_ENGINE_POOLING_RATIONALE='driver multiplexes per node; a proxy defeats token-aware routing'

# Not a dev-profile default: the JVM heap alone dwarfs the SQL engines.
DBTK_ENGINE_MIN_MEMORY_MB=2048
DBTK_ENGINE_HEAVY=true

DBTK_ENGINE_LICENSE=Apache-2.0
DBTK_ENGINE_OSI_APPROVED=true

# Publish policy. `derive` means we build and publish db-toolkit-<engine> from
# the upstream base. See SPEC section 22.5.
DBTK_ENGINE_PUBLISH=derive

# The upstream entrypoint's own variables, so compose generation wires the
# image's contract without knowing which engine it is dealing with.
DBTK_ENGINE_ROOT_PW_ENV=CASSANDRA_PASSWORD_FILE
DBTK_ENGINE_DEFAULT_DB_ENV=

# Where a mounted conf.d override lands for this engine.
DBTK_ENGINE_OVERRIDES_DIR=/dbtk/overrides

# Framework connection driver token, for the block new-project prints.
# No first-party Laravel driver; use a DataStax-compatible client.
DBTK_ENGINE_DRIVER=cassandra
