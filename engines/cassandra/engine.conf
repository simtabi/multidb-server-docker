# multidb-server engine descriptor: Apache Cassandra

MDB_ENGINE_NAME=cassandra
MDB_ENGINE_TITLE="Apache Cassandra"
MDB_ENGINE_FAMILY=cassandra
MDB_ENGINE_PARADIGM=wide-column

MDB_ENGINE_VERSIONS="4.1 5.0"
MDB_ENGINE_DEFAULT_VERSION=5.0

MDB_ENGINE_PORT=9042
MDB_ENGINE_HOST_PORT_DEFAULT=9042
MDB_ENGINE_DATA_DIR=/var/lib/cassandra
MDB_ENGINE_SOCKET_DIR=''
MDB_ENGINE_USER=cassandra
MDB_ENGINE_ROOT_SECRET=cassandra_root_password.txt

MDB_ENGINE_PING='nodetool status'
MDB_ENGINE_CLIENT=cqlsh
MDB_ENGINE_SHELL='cqlsh'

# Cassandra has no logical dump tool comparable to pg_dump. A snapshot is a
# hard-linked, per-node, point-in-time copy of the SSTables; the toolkit tars
# it so the artefact is a single verifiable file like every other engine's.
MDB_ENGINE_DUMP='nodetool snapshot'
MDB_ENGINE_DUMP_GLOBALS=''
MDB_ENGINE_RESTORE='sstableloader'
MDB_ENGINE_BACKUP_EXT=tar
MDB_ENGINE_BACKUP_STRATEGY=snapshot

# Ships AllowAllAuthenticator AND AllowAllAuthorizer: not weak authentication,
# none at all, and no authorization either. Our image flips both
# (SPEC section 22.3).
MDB_ENGINE_AUTH_METHOD=PasswordAuthenticator
MDB_ENGINE_AUTH_OFF_BY_DEFAULT_UPSTREAM=true
MDB_ENGINE_TLS_ALWAYS=false

# The driver keeps connections per node under a load-balancing policy and
# multiplexes thousands of concurrent requests per connection. A proxy in front
# defeats token-aware routing, which is where most of the performance is.
MDB_ENGINE_POOLING=driver
MDB_ENGINE_POOLER_IMAGE=''
MDB_ENGINE_POOLING_REQUIRED_IN_PROD=false
MDB_ENGINE_POOLING_RATIONALE='driver multiplexes per node; a proxy defeats token-aware routing'

# Not a dev-profile default: the JVM heap alone dwarfs the SQL engines.
MDB_ENGINE_MIN_MEMORY_MB=2048
MDB_ENGINE_HEAVY=true

MDB_ENGINE_LICENSE=Apache-2.0
MDB_ENGINE_OSI_APPROVED=true

# Publish policy. `derive` means we build and publish multidb-server-<engine> from
# the upstream base. See SPEC section 22.5.
MDB_ENGINE_PUBLISH=derive

# The upstream entrypoint's own variables, so compose generation wires the
# image's contract without knowing which engine it is dealing with.
MDB_ENGINE_ROOT_PW_ENV=CASSANDRA_PASSWORD_FILE
MDB_ENGINE_DEFAULT_DB_ENV=

# Where a mounted conf.d override lands for this engine.
MDB_ENGINE_OVERRIDES_DIR=/mdb/overrides

# Framework connection driver token, for the block new-project prints.
# No first-party Laravel driver; use a DataStax-compatible client.
MDB_ENGINE_DRIVER=cassandra
