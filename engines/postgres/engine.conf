# db-toolkit engine descriptor: PostgreSQL
#
# Shell key-value, not YAML: every consumer here is bash, and a format needing
# yq would add a dependency the toolkit does not otherwise have.

DBTK_ENGINE_NAME=pg
DBTK_ENGINE_TITLE="PostgreSQL"
DBTK_ENGINE_FAMILY=postgres
DBTK_ENGINE_PARADIGM=relational

DBTK_ENGINE_VERSIONS="15 16 17 18"
DBTK_ENGINE_DEFAULT_VERSION=17

DBTK_ENGINE_PORT=5432
DBTK_ENGINE_HOST_PORT_DEFAULT=5432
# PG 18 moved this to /var/lib/postgresql; check-env enforces the pairing.
DBTK_ENGINE_DATA_DIR=/var/lib/postgresql/data
DBTK_ENGINE_SOCKET_DIR=/var/run/postgresql
DBTK_ENGINE_USER=postgres
DBTK_ENGINE_ROOT_SECRET=pg_superuser_password.txt

DBTK_ENGINE_PING='pg_isready -U postgres'
DBTK_ENGINE_CLIENT=psql
DBTK_ENGINE_SHELL='psql -h /var/run/postgresql -U postgres'

# -Fc is the custom format: compressible and selectively restorable.
DBTK_ENGINE_DUMP='pg_dump -U postgres -Fc --no-password'
# Roles and grants live ONLY here. A per-database dump restores into a server
# nobody can log into, so this runs on every backup without exception.
DBTK_ENGINE_DUMP_GLOBALS='pg_dumpall -U postgres --globals-only --no-password'
DBTK_ENGINE_RESTORE='pg_restore -U postgres --no-owner --clean --if-exists'
DBTK_ENGINE_BACKUP_EXT=dump

DBTK_ENGINE_AUTH_METHOD=scram-sha-256
DBTK_ENGINE_TLS_ALWAYS=true

DBTK_ENGINE_POOLING=external
DBTK_ENGINE_POOLER_IMAGE='edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340'
# Overriding a service's entrypoint discards the image's CMD, so it has to be
# restated. Without it the shim generates the config and exits 0 -- a pooler
# that "started successfully" and is not listening.
DBTK_ENGINE_POOLER_CMD='/usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini'
DBTK_ENGINE_POOLER_PORT=6432
DBTK_ENGINE_POOLER_HOST_PORT_DEFAULT=6432
DBTK_ENGINE_POOLER_SECRET=pgbouncer_password.txt
# pgBouncer writes a generated userlist here. It is tmpfs so no credential
# reaches disk, which means it needs the runtime uid: a root-owned tmpfs is
# unwritable by a process that dropped to uid 70.
DBTK_ENGINE_POOLER_STATE_DIR=/etc/pgbouncer
DBTK_ENGINE_POOLER_UID=70
DBTK_ENGINE_POOLING_REQUIRED_IN_PROD=true
# ~10 MB per connection: 500 direct connections cost ~5 GB before a query runs.
DBTK_ENGINE_POOLING_RATIONALE='one OS process per connection'

DBTK_ENGINE_LICENSE=PostgreSQL
DBTK_ENGINE_OSI_APPROVED=true

# Publish policy. `derive` means we build and publish db-toolkit-<engine> from
# the upstream base. See SPEC section 22.5.
DBTK_ENGINE_PUBLISH=derive

# The upstream entrypoint's own variables, so compose generation wires the
# image's contract without knowing which engine it is dealing with.
DBTK_ENGINE_ROOT_PW_ENV=POSTGRES_PASSWORD_FILE
DBTK_ENGINE_DEFAULT_DB_ENV=POSTGRES_DB

# Where a mounted conf.d override lands for this engine.
DBTK_ENGINE_OVERRIDES_DIR=/etc/postgresql/conf.d/overrides

# Framework connection driver token, for the block new-project prints.
# Laravel calls PostgreSQL 'pgsql', not 'postgres'.
DBTK_ENGINE_DRIVER=pgsql
