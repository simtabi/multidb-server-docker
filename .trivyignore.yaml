  # ---------------------------------------------------------------------------
  # postgres_exporter -- Go toolchain CVEs, already on the newest release
  # ---------------------------------------------------------------------------
  # 0.20.1 (2026-07-07) is the latest upstream release, so there is nothing to
  # repin to. Both findings are in the Go toolchain the release was built with,
  # not in the exporter's own code. The exporter is off by default and, when on,
  # is reachable only on the internal metrics network.
  - id: CVE-2026-56852
    statement: >-
      postgres_exporter, golang.org/x/text, no newer upstream release exists to
      repin to. Off by default and internal-only when enabled. Revisit at the
      next postgres_exporter release.
    expired_at: 2026-11-09
  - id: CVE-2026-39822
    statement: >-
      postgres_exporter and gosu, Go stdlib os.Root, no newer upstream release
      exists to repin to. Revisit at the next postgres_exporter release.
    expired_at: 2026-11-09
