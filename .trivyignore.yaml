# Trivy waivers.
#
# Every entry here is a finding the build will NOT fail on. That is a decision
# each time, not a way to quiet the scanner, so the format makes the three
# things that decay impossible to omit:
#
#   id           what is waived
#   purls        WHERE it is waived -- so a waiver for one component cannot
#                silently cover the same CVE somewhere it was never considered
#   statement    why it cannot be fixed here
#   expired_at   when the decision stops being valid
#
# expired_at is the point of this file. The flat .trivyignore this replaced
# carried "revisit on base repin" in a comment, which is a promise rather than
# a mechanism -- nothing read it, and nothing would ever have failed if it were
# quietly ignored for two years. A date is enforced twice: trivy stops applying
# the waiver once it passes, and check 38 fails the harness before that with a
# message naming the entry. Waivers now expire whether or not anyone remembers.
#
# purls scope a waiver to a package. Without them this file is global, and
# accepting a jackson CVE for Cassandra would also accept it in any image that
# grows a jackson dependency later, silently and without anyone deciding to.
# A wrong purl fails safe: the waiver does not match, and the build fails.
#
# Prefer fixing over waiving. Most findings come from base images, so repinning
# a digest in images/bases.tsv resolves them outright -- check that first, and
# only waive when there is demonstrably nothing to repin to.

vulnerabilities:

  # ---------------------------------------------------------------------------
  # Apache Cassandra -- vendored Java dependencies
  # ---------------------------------------------------------------------------
  # Cassandra ships these JARs inside its own distribution, in lib/, at versions
  # the Apache release process chose. Three facts make them waivers rather than
  # fixes:
  #
  #   1. images/bases.tsv already pins 5.0.8 and 4.1.11, published 2026-08-05 and
  #      the newest releases of either series. There is nothing to repin to.
  #   2. Replacing a JAR inside lib/ is not a supported configuration; Cassandra
  #      is tested against the versions it ships, and a swapped netty or jackson
  #      is a node that fails in production rather than in CI.
  #   3. The fixed versions exist upstream in the LIBRARY, not in a Cassandra
  #      release. Only Apache can close these, by shipping a new Cassandra.
  #
  # What reduces the exposure meanwhile is the toolkit's own posture rather than
  # anything about the CVEs: Cassandra is authenticated by default here (check
  # 32 proves it) and publishes no host port under the default MDB_PUBLISH=none,
  # so the native protocol is reachable only from the compose network.
  #
  # Revisit condition: the next Cassandra release on either series. These expire
  # 2026-11-09 regardless -- if no release has landed by then the decision gets
  # made again with whatever is true at that point, rather than inherited.

  - id: GHSA-r7wm-3cxj-wff9
    purls:
      - "pkg:maven/com.fasterxml.jackson.core/jackson-core"
    statement: >-
      Vendored by Apache Cassandra 5.0.8 and 4.1.11, both the newest releases of
      their series, so there is no base image to repin to. Fixed only in the
      library, not in any Cassandra release. Revisit at the next Cassandra release.
    expired_at: 2026-11-09

  - id: CVE-2026-54512
    purls:
      - "pkg:maven/com.fasterxml.jackson.core/jackson-databind"
    statement: >-
      jackson-databind arbitrary code execution via polymorphic deserialization,
      vendored by Cassandra 5.0.8 and 4.1.11 with no newer release to repin to.
      Replacing the JAR inside lib/ is an untested Cassandra configuration.
      Revisit at the next Cassandra release.
    expired_at: 2026-11-09

  - id: CVE-2026-54513
    purls:
