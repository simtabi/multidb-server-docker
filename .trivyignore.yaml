  # ---------------------------------------------------------------------------
  # gosu -- Go standard library CVEs in a statically linked setuid helper
  # ---------------------------------------------------------------------------
  # gosu ships in the upstream postgres base image; we do not build it and cannot
  # repin it independently. Every finding is in the Go standard library it was
  # compiled against, in packages gosu does not reach: it drops privileges at
  # container start and execs, parsing no untrusted input and opening no sockets.
  # net/mail, mime and net/http parsing are not on any path it executes.
  #
  # These carry no purls deliberately. Trivy attributes them to the Go stdlib
  # rather than to gosu, and a stdlib purl would be both wrong and broad. The
  # scoping here is the statement plus the expiry.
  #
  # Revisit whenever images/bases.tsv is repinned -- a rebuilt base picks up a
  # newer gosu and these should disappear rather than be re-waived.
  - id: CVE-2025-61726
    statement: >-
      gosu, Go stdlib, unreachable in a setuid exec helper that parses no
      untrusted input. Revisit on the next images/bases.tsv repin.
    expired_at: 2026-11-09
  - id: CVE-2025-61729
    statement: >-
      gosu, Go stdlib, unreachable in a setuid exec helper that parses no
      untrusted input. Revisit on the next images/bases.tsv repin.
    expired_at: 2026-11-09
