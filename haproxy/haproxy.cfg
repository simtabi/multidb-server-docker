# db-toolkit HAProxy — routes by asking Patroni, not by static configuration.
#
# The whole point: after an election the write port must follow the NEW leader
# without anyone editing this file. Patroni's REST API answers /primary with 200
# on the leader and 503 elsewhere, and /replica the other way round, so HAProxy
# discovers the roles on every health check.

global
    maxconn 500
    log stdout format raw local0 info

defaults
    log     global
    mode    tcp
    retries 2
    timeout client  30m
    timeout server  30m
    timeout connect 4s
    timeout check   3s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

# Writes. Exactly one backend answers /primary with 200 at any moment, so this
# resolves to the leader and moves when the leader moves.
listen postgres_write
    bind *:5432
    option httpchk GET /primary
    http-check expect status 200
    # init-addr last,libc,none: HAProxy resolves server names at STARTUP and
    # refuses to start if one does not resolve. A Patroni node that is still
    # booting would therefore take HAProxy down with it, which is the opposite
    # of what a load balancer is for. `none` lets it start and resolve later.
    default-server inter 3s fall 3 rise 2 init-addr last,libc,none on-marked-down shutdown-sessions
    server patroni1 patroni1:5432 maxconn 100 check port 8008
    server patroni2 patroni2:5432 maxconn 100 check port 8008
    server patroni3 patroni3:5432 maxconn 100 check port 8008

# Reads. /replica answers 200 only on standbys, so the leader is never in this
# pool -- a read port that quietly served the primary would hide exactly the
# replication problem you opened it to avoid.
listen postgres_read
    bind *:5433
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 init-addr last,libc,none
    server patroni1 patroni1:5432 maxconn 100 check port 8008
    server patroni2 patroni2:5432 maxconn 100 check port 8008
    server patroni3 patroni3:5432 maxconn 100 check port 8008
