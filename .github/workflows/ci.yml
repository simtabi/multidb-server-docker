name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded run proves nothing about the commit that replaced it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The build matrix comes from the engine descriptors, not from this file.
  # Listing versions here would mean adding one to a descriptor and having it
  # silently never built, which is the failure the descriptors exist to prevent.
  # ---------------------------------------------------------------------------
  matrix:
    name: resolve matrix
    runs-on: ubuntu-latest
    # Every job gets a timeout: the Actions default is 360 minutes, which is
    # unbounded for practical purposes if a runner ever hangs on this.
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.gen.outputs.versions }}
    steps:
      # Pinned to the commit, not the tag, for the same reason the trivy binary
      # is checksum-verified below: 75 of trivy-action's 76 tags were force-
      # pushed in the 2026 supply-chain attack, and tj-actions spread the same
      # way. Dependabot's github-actions ecosystem bumps the SHA and keeps the
      # version comment current.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # No job in this workflow pushes, so the token has no business
          # outliving the checkout step. Without this, checkout writes the
          # credential into .git/config, where any later step -- or anything
          # that archives the workspace -- can read it.
          persist-credentials: false
      - id: gen
        run: echo "versions=$(scripts/ci-matrix versions)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Every declared version builds, on both architectures.
  #
  # This is separate from `verify` on purpose: a version that appears on an
  # engine's menu but cannot be built is a broken promise, and finding that out
  # does not require running the whole acceptance harness against it.
  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.entry.engine }} ${{ matrix.entry.version }} (${{ matrix.arch }})
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Two dimensions, crossed: every declared version on every architecture.
        entry: ${{ fromJSON(needs.matrix.outputs.versions) }}
        arch: [amd64, arm64]
        # `include` entries that match an existing combination ADD fields to
        # it rather than creating new ones, which is how each arch gets its
        # runner without naming every pair.
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      # Pinned to the commit, not the tag, for the same reason the trivy binary
      # is checksum-verified below: 75 of trivy-action's 76 tags were force-
      # pushed in the 2026 supply-chain attack, and tj-actions spread the same
      # way. Dependabot's github-actions ecosystem bumps the SHA and keeps the
      # version comment current.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # No job in this workflow pushes, so the token has no business
          # outliving the checkout step. Without this, checkout writes the
          # credential into .git/config, where any later step -- or anything
          # that archives the workspace -- can read it.
          persist-credentials: false

      - name: Confirm docker is available
        run: docker info

      - name: Build ${{ matrix.entry.engine }} ${{ matrix.entry.version }}
        env:
          ENGINE: ${{ matrix.entry.engine }}
          VERSION: ${{ matrix.entry.version }}
        run: |
          set -euo pipefail
          cp .env.example .env
          upper="$(printf '%s' "$ENGINE" | tr '[:lower:]-' '[:upper:]_')"
          # The version is chosen the same way `make build` chooses it, through
          # .env, rather than by a second mechanism that could disagree.
          sed -i "s/^MDB_${upper}_VERSION=.*/MDB_${upper}_VERSION=${VERSION}/" .env
          scripts/build "$ENGINE"

      # ---------------------------------------------------------------------
      # Vulnerability scan, on the image that was just built.
      #
      # The trivy BINARY, pinned by version and verified against the release
      # checksums -- not aquasecurity/trivy-action. In March 2026 an attacker
      # force-pushed 75 of that action's 76 version tags to steal CI secrets,
      # so referencing it by tag is exactly the supply-chain risk a security
      # scanner is supposed to reduce. The same reasoning that pins every base
      # image by digest applies to the thing doing the scanning.
      # ---------------------------------------------------------------------
      - name: Install trivy
        env:
          TRIVY_VERSION: 0.73.0
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64)  t_arch=64bit ;;
            aarch64) t_arch=ARM64 ;;
            *) echo "unsupported architecture: $arch" >&2; exit 1 ;;
          esac
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-${t_arch}.tar.gz"
          # Saved under its REAL name: `sha256sum -c` looks the file up by the
          # name written in the checksum line, so downloading to trivy.tar.gz
          # made it fail with "No such file or directory" -- which reads as a
          # failed download rather than a naming mismatch.
          curl -fsSL -o "$tarball" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" trivy
          sudo mv trivy /usr/local/bin/
          trivy --version

      - name: Scan ${{ matrix.entry.engine }} ${{ matrix.entry.version }}
        env:
          ENGINE: ${{ matrix.entry.engine }}
          VERSION: ${{ matrix.entry.version }}
        run: |
          set -euo pipefail
          # Fails the build on HIGH and CRITICAL with a known fix. Unfixed
          # findings are reported but do not fail: there is nothing to do about
          # them yet, and a scanner that cannot be made green stops being read.
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore.yaml \
            --exit-code 1 \
            --format table \
            "ghcr.io/simtabi/multidb-server-${ENGINE}:${VERSION}"

      - name: Report unfixed findings (never fails)
        if: always()
        env:
          ENGINE: ${{ matrix.entry.engine }}
          VERSION: ${{ matrix.entry.version }}
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 0 --format table \
            "ghcr.io/simtabi/multidb-server-${ENGINE}:${VERSION}" || true

  # ---------------------------------------------------------------------------
  # The acceptance harness, on default versions, on both architectures.
  # ---------------------------------------------------------------------------
  verify:
    name: verify (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      # Pinned to the commit, not the tag, for the same reason the trivy binary
      # is checksum-verified below: 75 of trivy-action's 76 tags were force-
      # pushed in the 2026 supply-chain attack, and tj-actions spread the same
      # way. Dependabot's github-actions ecosystem bumps the SHA and keeps the
      # version comment current.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # No job in this workflow pushes, so the token has no business
          # outliving the checkout step. Without this, checkout writes the
          # credential into .git/config, where any later step -- or anything
          # that archives the workspace -- can read it.
          persist-credentials: false

      # Same pinned version as lint.yml; see the note there.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          curl -fsSL -o sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.${arch}.tar.xz"
          tar -xJf sc.tar.xz
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # CLAUDE.md is explicit that docker is required and never mocked, so a
      # runner without it must fail here rather than silently skipping checks.
      - name: Confirm docker is available
        run: docker info

      - name: Harness structure
        run: make verify-structure

      # Without this there is no .env, no secrets/ and no certs/, so every
      # check that boots an engine fails on setup rather than on its subject.
      - name: Initialise the checkout
        run: make init

      # Explicit, because check 32 now FAILS on a missing image rather than
      # skipping it. Relying on an earlier check to have built what a later one
      # needs is how that check came to verify one engine out of six.
      - name: Build the engine images
        run: make build

      - name: Full acceptance harness
        run: make verify

      # A failure is usually explained by the engine's own log, which the
      # harness cannot print for a container it has already cleaned up.
      - name: Container logs on failure
        if: failure()
        run: |
          docker ps -a --format '{{.Names}}\t{{.Status}}'
          for c in $(docker ps -aq); do
            echo "=== $(docker inspect -f '{{.Name}}' "$c") ==="
            docker logs --tail 50 "$c" 2>&1 || true
          done
