name: Static analysis

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint every shell script
        run: make lint

  harness-structure:
    name: harness structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The harness must be well-formed even while the features it checks do
      # not exist yet. This is the gate that stays green through every phase.
      - name: Validate the verify harness
        run: make verify-structure
