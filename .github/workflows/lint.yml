name: Static analysis

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to the commit, not the tag -- a moved tag is how the tj-actions
      # and trivy-action supply-chain attacks spread. Dependabot's
      # github-actions ecosystem bumps the SHA and keeps the comment current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this workflow pushes, so the token has no business
          # outliving the checkout step. Without this, checkout writes the
          # credential into .git/config, where any later step -- or anything
          # that archives the workspace -- can read it.
          persist-credentials: false

      # PINNED, not apt's.
      #
      # Ubuntu ships an older shellcheck than developers install locally, and
      # the two disagree: the runner rejected SC2015 patterns that shellcheck
      # 0.11 no longer reports, so `make lint` passed on a laptop and failed in
      # CI. A gate that disagrees with the gate people run before pushing is
      # worse than no gate -- it teaches them to push and see.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          set -euo pipefail
          curl -fsSL -o sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf sc.tar.xz
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Lint every shell script
        run: make lint

  harness-structure:
    name: harness structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to the commit, not the tag -- a moved tag is how the tj-actions
      # and trivy-action supply-chain attacks spread. Dependabot's
      # github-actions ecosystem bumps the SHA and keeps the comment current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this workflow pushes, so the token has no business
          # outliving the checkout step. Without this, checkout writes the
          # credential into .git/config, where any later step -- or anything
          # that archives the workspace -- can read it.
          persist-credentials: false

      # The harness must be well-formed even while the features it checks do
      # not exist yet. This is the gate that stays green through every phase.
      - name: Validate the verify harness
        run: make verify-structure
