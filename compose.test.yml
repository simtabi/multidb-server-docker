# multidb-server TEST profile — speed over durability, for CI and test suites.
#
# **DATA LOSS ON STOP IS THE POINT.** The data directory is a tmpfs and every
# durability guarantee is switched off. Never point this at anything you intend
# to keep; `make test-profile` exists so a test suite can run against a real
# engine at memory speed and throw the result away.
#
# Used as an overlay: docker compose -f docker-compose.yml -f compose.test.yml

services:
  pg:
    environment:
      # fsync=off alone is not enough. synchronous_commit=off removes the WAL
      # flush wait and full_page_writes=off removes torn-page protection, both
      # of which are pure overhead when the storage is RAM and the data is
      # disposable.
      MDB_PG_TEST_MODE: "true"
    tmpfs:
      # PostgreSQL refuses to start on a data directory with loose permissions,
      # so the mode is set explicitly. uid/gid 999 is the postgres user in the
      # base image.
      - /var/lib/postgresql/data:rw,mode=0700,uid=999,gid=999,size=2g
    # !override replaces the base file's list instead of merging with it.
    # Without it the named data volume and this tmpfs both target the same path
    # and compose refuses to start.
    volumes: !override
      - ./certs:/certs:ro
      - ./secrets:/run/secrets:ro

  mysql:
    environment:
      MDB_MYSQL_TEST_MODE: "true"
    tmpfs:
      - /var/lib/mysql:rw,mode=0700,uid=999,gid=999,size=2g
    # !override replaces the base file's list instead of merging with it.
    # Without it the named data volume and this tmpfs both target the same path
    # and compose refuses to start.
    volumes: !override
      - ./certs:/certs:ro
      - ./secrets:/run/secrets:ro

  mariadb:
    environment:
      MDB_MARIADB_TEST_MODE: "true"
    tmpfs:
      - /var/lib/mysql:rw,mode=0700,uid=999,gid=999,size=2g
    # !override replaces the base file's list instead of merging with it.
    # Without it the named data volume and this tmpfs both target the same path
    # and compose refuses to start.
    volumes: !override
      - ./certs:/certs:ro
      - ./secrets:/run/secrets:ro
