# db-toolkit HA — Patroni, an etcd quorum, and HAProxy.
#
# **This is a REHEARSAL topology, not production HA.** Every node here is on one
# host, so the host is a single point of failure and no amount of Patroni fixes
# that. What it does give you is a real cluster to practise on: a genuine
# leader election, a write port that follows it, and a `patronictl` you can
# break things with before you do it somewhere that matters. SPEC section 21.2
# is explicit about the distinction and the docs must not blur it.
#
# Used as an overlay:
#   docker compose -f docker-compose.yml -f compose.engines.yml -f compose.ha.yml

x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.21@sha256:a3ccd299377af4b9968d8cbaaf9722fe354297f11908f74a846075e1e5f4ee89
  profiles: [ha]
  restart: unless-stopped
  networks: [dbtk]
  environment: &etcd_env
    ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
    ETCD_INITIAL_CLUSTER_STATE: new
    ETCD_INITIAL_CLUSTER_TOKEN: dbtk-etcd
    ETCD_ENABLE_V2: "false"
    # etcd refuses to serve once its disk fills, and a dev machine's disk does
    # fill. Auto-compaction keeps the history bounded so the cluster does not
    # wedge on something unrelated to the database.
    ETCD_AUTO_COMPACTION_RETENTION: "1"
    ETCD_QUOTA_BACKEND_BYTES: "536870912"
  healthcheck:
    test: ["CMD", "etcdctl", "endpoint", "health"]
    interval: 5s
    timeout: 3s
    retries: 12

x-patroni: &patroni
  build:
    context: ./images
    dockerfile: patroni/Dockerfile
    args:
      ENGINE_VERSION: ${DBTK_PG_VERSION:-17}
  image: ghcr.io/simtabi/db-toolkit-patroni:${DBTK_PG_VERSION:-17}
  profiles: [ha]
  restart: unless-stopped
  networks: [dbtk]
  depends_on:
    etcd1: {condition: service_healthy}
    etcd2: {condition: service_healthy}
    etcd3: {condition: service_healthy}
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
  environment: &patroni_env
    # The data directory is a CHILD of the mounted volume, never the mount
    # point itself. Bootstrapping a replica makes Patroni remove or rename the
    # data directory, and a mount point can be neither -- it fails with
    # "Device or resource busy" and the replica never joins, while the leader
    # looks perfectly healthy.
    PGDATA: /var/lib/postgresql/patroni/pgdata
    PATRONI_SCOPE: ${DBTK_HA_CLUSTER_NAME:-dbtk-pg}
    PATRONI_ETCD3_HOSTS: "'etcd1:2379','etcd2:2379','etcd3:2379'"
    DBTK_PG_SYNC_MODE: ${DBTK_PG_SYNC_MODE:-false}
    DBTK_TZ: ${DBTK_TZ:-UTC}
  volumes:
    - ./certs:/certs:ro
    - ./secrets:/run/secrets:ro
  # Patroni shuts PostgreSQL down itself, and a demotion or a checkpoint is not
  # something to interrupt after Docker's 10s default.
  stop_grace_period: ${DBTK_STOP_GRACE:-60s}
  healthcheck:
    # Any Patroni node answering its REST API is healthy; being the LEADER is a
    # different question, and one that changes. A healthcheck that demanded
    # leadership would mark two of three nodes unhealthy by design.
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8008/health || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 60s

services:
  etcd1:
    <<: *etcd
    container_name: ${COMPOSE_PROJECT_NAME:-dbtk}-etcd1
    environment:
      <<: *etcd_env
      ETCD_NAME: etcd1
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd1:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd1:2379
    volumes: [etcd1_data:/etcd-data]

  etcd2:
    <<: *etcd
    container_name: ${COMPOSE_PROJECT_NAME:-dbtk}-etcd2
    environment:
      <<: *etcd_env
      ETCD_NAME: etcd2
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd2:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd2:2379
    volumes: [etcd2_data:/etcd-data]

  # Three, not two. A two-member etcd cannot form a majority after losing one,
  # so it is strictly LESS available than a single node -- SPEC section 21.2,
  # and check 27 fails on a member count below three rather than warning.
  etcd3:
    <<: *etcd
    container_name: ${COMPOSE_PROJECT_NAME:-dbtk}-etcd3
    environment:
      <<: *etcd_env
      ETCD_NAME: etcd3
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd3:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd3:2379
    volumes: [etcd3_data:/etcd-data]

  patroni1:
    <<: *patroni
    container_name: ${COMPOSE_PROJECT_NAME:-dbtk}-patroni1
    hostname: patroni1
    environment:
      <<: *patroni_env
      PATRONI_NAME: patroni1
    volumes:
      - patroni1_data:/var/lib/postgresql/patroni
      - ./certs:/certs:ro
      - ./secrets:/run/secrets:ro

  patroni2:
    <<: *patroni
    container_name: ${COMPOSE_PROJECT_NAME:-dbtk}-patroni2
    hostname: patroni2
    environment:
      <<: *patroni_env
      PATRONI_NAME: patroni2
    volumes:
      - patroni2_data:/var/lib/postgresql/patroni
      - ./certs:/certs:ro
      - ./secrets:/run/secrets:ro

  patroni3:
    <<: *patroni
    container_name: ${COMPOSE_PROJECT_NAME:-dbtk}-patroni3
    hostname: patroni3
    environment:
      <<: *patroni_env
      PATRONI_NAME: patroni3
    volumes:
      - patroni3_data:/var/lib/postgresql/patroni
      - ./certs:/certs:ro
      - ./secrets:/run/secrets:ro

  haproxy:
    image: haproxy:3.0-alpine@sha256:7c8dac975b9def049d6585b7efe865486acaa7b6ec5e74eec45f08fde8bb2ad4
    container_name: ${COMPOSE_PROJECT_NAME:-dbtk}-haproxy
    profiles: [ha]
    restart: unless-stopped
    networks: [dbtk]
    depends_on: [patroni1, patroni2, patroni3]
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${DBTK_BIND_ADDR:-127.0.0.1}:${DBTK_HAPROXY_WRITE_PORT:-5432}:5432"
      - "${DBTK_BIND_ADDR:-127.0.0.1}:${DBTK_HAPROXY_READ_PORT:-5433}:5433"
      - "${DBTK_BIND_ADDR:-127.0.0.1}:${DBTK_HAPROXY_STATS_PORT:-7000}:7000"
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  etcd1_data:
    name: ${COMPOSE_PROJECT_NAME:-dbtk}_etcd1_data
  etcd2_data:
    name: ${COMPOSE_PROJECT_NAME:-dbtk}_etcd2_data
  etcd3_data:
    name: ${COMPOSE_PROJECT_NAME:-dbtk}_etcd3_data
  # Per node AND per major, for the same reason the standalone volumes are:
  # pointing a new major at an old data directory fails hard.
  patroni1_data:
    name: ${COMPOSE_PROJECT_NAME:-dbtk}_patroni1_pg${DBTK_PG_VERSION:-17}_data
  patroni2_data:
    name: ${COMPOSE_PROJECT_NAME:-dbtk}_patroni2_pg${DBTK_PG_VERSION:-17}_data
  patroni3_data:
    name: ${COMPOSE_PROJECT_NAME:-dbtk}_patroni3_pg${DBTK_PG_VERSION:-17}_data
