# my-multidb-server — a thin orchestrator. Selection and wiring only.
#
# Everything that configures an engine lives in its image (SPEC decision 11), so
# this file chooses which engines run and how they are exposed. Nothing here is
# published to the host by default: apps join the mmdb network by service name.
#
# Internal container ports are fixed and never change. Every host-side binding
# is ${MMDB_*_HOST_PORT}-driven, so resolving a port collision on any machine is
# a one-line .env change and never an edit to this file (SPEC section 7).
#
# ENGINE SERVICES ARE NOT HERE. They are generated into compose.engines.yml
# from engines/*/engine.conf (SPEC section 22.1), and compose picks that file
# up via COMPOSE_FILE in .env. This file holds the services there is exactly
# one of: the UIs, Caddy, the exporters and the backup sidecars.

name: ${COMPOSE_PROJECT_NAME:-mmdb}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${MMDB_LOG_MAX_SIZE:-10m}
    max-file: "${MMDB_LOG_MAX_FILE:-3}"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  phpmyadmin:
    profiles: [ui]
    image: phpmyadmin:5.2.3@sha256:5e2289bcd500868ed4ac9261ddd7cbcc6e20036f83031ade72667b15dca31c60
    restart: unless-stopped
    <<: *hardening
    environment:
      # A comma-separated list, which is what lets a single instance offer both
      # servers on the login screen (SPEC section 18).
      PMA_HOSTS: ${MMDB_PMA_HOSTS:-mysql,mariadb}
      PMA_PORTS: ${MMDB_PMA_PORTS:-3306,3306}
      UPLOAD_LIMIT: ${MMDB_PMA_UPLOAD_LIMIT:-256M}
    ports:
      - "${MMDB_BIND_ADDR:-127.0.0.1}:${MMDB_PMA_HOST_PORT:-8081}:80"
    networks: [mmdb]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Adminer — speaks PostgreSQL, MySQL, and MariaDB
  # ---------------------------------------------------------------------------
  adminer:
    profiles: [ui]
    image: adminer:5.4.1@sha256:a3167350c4eb9ae4473b8ea0f49c8e5ae74c87b240ee2f6086521dba2a6bf243
    restart: unless-stopped
    <<: *hardening
    environment:
      # Pre-wired so the UI opens ready to log in rather than asking for a
      # hostname (SPEC section 7).
      ADMINER_DEFAULT_SERVER: ${MMDB_ADMINER_DEFAULT_SERVER:-pg}
    ports:
      - "${MMDB_BIND_ADDR:-127.0.0.1}:${MMDB_ADMINER_HOST_PORT:-8080}:8080"
    networks: [mmdb]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # pgAdmin — pre-provisioned with the toolkit's PostgreSQL
  # ---------------------------------------------------------------------------
  pgadmin:
    profiles: [ui]
    image: dpage/pgadmin4:9.9@sha256:5d9624a93634d1c5e595619cc57b1d330758120d1baf445fa97300c0c1fc3c0a
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${MMDB_PGADMIN_EMAIL:-admin@db.localhost}
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password.txt
      PGADMIN_LISTEN_PORT: "80"
      PGADMIN_CONFIG_SERVER_MODE: "False"
      # pgAdmin validates the login address and rejects reserved special-use
      # domains, so the natural admin@db.localhost default makes it crash-loop
      # on first boot with "does not appear to be a valid email address".
      # This is the supported allowlist for exactly that case.
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['${MMDB_UI_DOMAIN:-db.localhost}','localhost']"
    volumes:
      # Rendered by scripts/env-render so the UI opens with the server already
      # listed rather than asking for a hostname (SPEC section 7).
      - ./caddy/servers.json:/pgadmin4/servers.json:ro
      - ./secrets:/run/secrets:ro
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${MMDB_BIND_ADDR:-127.0.0.1}:${MMDB_PGADMIN_HOST_PORT:-8082}:80"
    networks: [mmdb]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Caddy — the web front door, and in prod the only published service
  # ---------------------------------------------------------------------------
  caddy:
    profiles: [ui, prod]
    image: caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    restart: unless-stopped
    <<: *hardening
    # Binding 80/443 needs this one capability back; everything else stays
    # dropped.
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      # Rendered from caddy/Caddyfile.tmpl (dev) or Caddyfile.prod.tmpl (prod).
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persisted so the internal CA and any issued certificates survive a
      # restart; without this every `make up` would mint a new local CA and
      # browsers would warn again each time.
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${MMDB_BIND_ADDR:-127.0.0.1}:${MMDB_CADDY_HTTP_PORT:-80}:80"
      - "${MMDB_BIND_ADDR:-127.0.0.1}:${MMDB_CADDY_HTTPS_PORT:-443}:443"
    networks: [mmdb]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Scheduled backups — one sidecar per engine.
  #
  # Per-engine rather than one shared sidecar so each gets its OWN native dump
  # client from its own image: mariadb-dump against a MySQL 8.4 server is the
  # kind of thing that works until it does not. The alternative, a single
  # container with all three clients, is the cli image, and reaching into other
  # containers would mean mounting the docker socket -- a far larger grant than
  # a backup job needs.
  #
  # Every one of these runs scripts/backup, the SAME file the make targets run,
  # so the dump flags cannot drift between the nightly path and the manual one
  # (SPEC section 11).
  # ---------------------------------------------------------------------------
  backup-pg:
    profiles: [backup]
    image: ghcr.io/simtabi/my-multidb-server-pg:${MMDB_PG_VERSION:-17}
    restart: unless-stopped
    <<: *hardening
    entrypoint: ["/mmdb/scripts/backup", "--engine", "pg", "--schedule"]
    # The sidecar runs on the engine's image but is NOT the engine, so the
    # inherited healthcheck (pg_isready / mysqladmin ping) probes a server that
    # is not running here and reports the container unhealthy forever.
    healthcheck:
      disable: true
    environment:
      MMDB_IN_CONTAINER: "1"
      MMDB_BACKUP_DIR: /backups
      PGHOST: pg
      PGUSER: postgres
    volumes:
      - ./scripts:/mmdb/scripts:ro
      - ./secrets:/run/secrets:ro
      - ./backups:/backups
      - ./.env:/mmdb/.env:ro
    working_dir: /mmdb
    networks: [mmdb]
    logging: *default-logging

  backup-mysql:
    profiles: [backup]
    image: ghcr.io/simtabi/my-multidb-server-mysql:${MMDB_MYSQL_VERSION:-8.4}
    restart: unless-stopped
    <<: *hardening
    entrypoint: ["/mmdb/scripts/backup", "--engine", "mysql", "--schedule"]
    # The sidecar runs on the engine's image but is NOT the engine, so the
    # inherited healthcheck (pg_isready / mysqladmin ping) probes a server that
    # is not running here and reports the container unhealthy forever.
    healthcheck:
      disable: true
    environment:
      MMDB_IN_CONTAINER: "1"
      MMDB_BACKUP_DIR: /backups
      MYSQL_HOST: mysql
    volumes:
      - ./scripts:/mmdb/scripts:ro
      - ./secrets:/run/secrets:ro
      - ./backups:/backups
      - ./.env:/mmdb/.env:ro
    working_dir: /mmdb
    networks: [mmdb]
    logging: *default-logging

  backup-mariadb:
    profiles: [backup]
    image: ghcr.io/simtabi/my-multidb-server-mariadb:${MMDB_MARIADB_VERSION:-11.4}
    restart: unless-stopped
    <<: *hardening
    entrypoint: ["/mmdb/scripts/backup", "--engine", "mariadb", "--schedule"]
    # The sidecar runs on the engine's image but is NOT the engine, so the
    # inherited healthcheck (pg_isready / mysqladmin ping) probes a server that
    # is not running here and reports the container unhealthy forever.
    healthcheck:
      disable: true
    environment:
      MMDB_IN_CONTAINER: "1"
      MMDB_BACKUP_DIR: /backups
      MYSQL_HOST: mariadb
    volumes:
      - ./scripts:/mmdb/scripts:ro
      - ./secrets:/run/secrets:ro
      - ./backups:/backups
      - ./.env:/mmdb/.env:ro
    working_dir: /mmdb
    networks: [mmdb]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Metrics — exporters on the internal network, published to nothing.
  #
  # Prometheus and Grafana are out of scope (SPEC section 12); these expose the
  # endpoints and it is up to your monitoring stack to scrape them over the
  # mmdb network.
  # ---------------------------------------------------------------------------
  pg-exporter:
    profiles: [metrics]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    restart: unless-stopped
    <<: *hardening
    environment:
      # The exporter reads the password from a file rather than taking it in
      # the connection string, so no credential appears in `docker inspect`.
      DATA_SOURCE_URI: "pg:5432/${MMDB_PG_DEFAULT_DB:-postgres}?sslmode=disable"
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS_FILE: /run/secrets/pg_superuser_password.txt
    volumes:
      - ./secrets:/run/secrets:ro
    networks: [mmdb]
    logging: *default-logging

  mysqld-exporter:
    profiles: [metrics]
    image: prom/mysqld-exporter:v0.19.0@sha256:eacb4b18e2ec1e0abdf2d64851b68526c964f6d9cb3e9458fb5d5f5062ea94c1
    restart: unless-stopped
    <<: *hardening
    command:
      - "--mysqld.address=mysql:3306"
      - "--mysqld.username=root"
    environment:
      MYSQLD_EXPORTER_PASSWORD_FILE: /run/secrets/mysql_root_password.txt
    volumes:
      - ./secrets:/run/secrets:ro
    networks: [mmdb]
    logging: *default-logging

networks:
  mmdb:
    name: ${COMPOSE_PROJECT_NAME:-mmdb}_net
    ipam:
      config:
        - subnet: ${MMDB_NETWORK_SUBNET:-172.28.0.0/16}

volumes:
  # Per-engine, per-major volumes. Pointing a new PostgreSQL major at an old
  # data directory fails hard ("database files are incompatible with server"),
  # so the major is part of the volume name and versions coexist safely
  # (SPEC decision 2).
  pgadmin_data:
    name: ${COMPOSE_PROJECT_NAME:-mmdb}_pgadmin_data
  caddy_data:
    name: ${COMPOSE_PROJECT_NAME:-mmdb}_caddy_data
  caddy_config:
    name: ${COMPOSE_PROJECT_NAME:-mmdb}_caddy_config
